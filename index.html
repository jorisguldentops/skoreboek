<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1f26">
<title>Skoreboek</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* VOICE: rustig nachtelijk werkinstrument voor een leerkracht met een stapel examens
   IDEA: een puntenboek dat 's avonds aan de keukentafel opengaat: donker blad, heldere cijfers
   PICTURE: het werkvlak zelf: rijen leerlingen met grote scoreknoppen, foutcodes met aftrek, modeloplossing ernaast
   COLOUR and TYPE: antraciet #1c1f26, lichtgrijs #e6e6e6, mint #5fd3b5 voor scores en acties, koraal #ff7a6b voor fouten; systeemletter
   LAYOUT: smalle kop met klas en toets, één werkkolom, modeloplossing rechts; stapelt onder 900px */
:root{color-scheme:dark;--bg:#1c1f26;--paper:#252a33;--paper2:#2d333e;--ink:#e6e6e6;--mute:#9aa1ac;--line:#3a414d;
--mint:#5fd3b5;--mint-d:#173a33;--err:#ff7a6b;--err-bg:#3d2523;--warn:#f2c14e}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
header{border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) max(4vw,14px) 0;background:var(--bg);position:sticky;top:0;z-index:5}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
h1{font-size:clamp(24px,3vw,32px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h1 i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--mint);color:var(--bg);font-style:normal;font-size:17px;font-weight:800}
.sel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=date],textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;min-height:44px}
textarea{width:100%;min-height:120px;resize:vertical}
.status{font-size:13px;color:var(--mute)}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav button{flex:none;border:0;background:none;padding:10px 14px;min-height:44px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-current=true]{color:var(--ink);border-bottom-color:var(--mint)}
main{padding:20px max(4vw,14px) 60px;max-width:1400px;margin:0 auto}
h2{font-size:22px;margin:0 0 4px;line-height:1.2}
h3{font-size:17px;margin:22px 0 8px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--mint);color:#10241f;border-color:var(--mint)}
.btn.red{color:var(--err);border-color:var(--err);background:none}
.btn:disabled{opacity:.4;cursor:default}
label.btn{position:relative;cursor:pointer}
label.btn input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 14px;min-height:44px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--mint);color:#10241f}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;min-height:40px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip small{font-weight:500;color:var(--mute);font-size:12px}
.chip.done{border-color:var(--mint);color:var(--mint)}
.chip[aria-pressed=true]{background:var(--mint);color:#10241f;border-color:var(--mint)}
.chip[aria-pressed=true] small{color:inherit}
.qhead{background:var(--paper);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:6px}
.qhead b{font-size:19px}
.meta{font-size:14px;color:var(--mute)}
.rows{border-top:1px solid var(--line)}
.r{display:grid;grid-template-columns:minmax(120px,1.1fr) auto minmax(0,2.4fr);gap:8px 14px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.with-opl .r{grid-template-columns:minmax(110px,1fr) auto}
.with-opl .r .extra{grid-column:1/-1}
.r.afw{opacity:.45}
.r .nm{font-weight:600}
.r .nm small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.score{display:flex;align-items:center;gap:4px}
.score button{width:42px;height:44px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-weight:700;font-size:14px}
.score input{width:66px;text-align:center;font-weight:800;font-size:19px;color:var(--mint);padding:6px;background:var(--paper2)}
.score input.part{color:var(--warn)}
.score .of{color:var(--mute);font-size:14px;white-space:nowrap;margin:0 4px}
.extra{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.code{border:1px dashed var(--line);background:none;border-radius:6px;padding:5px 9px;min-height:38px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.code em{font-style:normal;color:var(--err);font-weight:700}
.code[aria-pressed=true]{border:1px solid var(--err);background:var(--err-bg);color:var(--err);font-weight:600}
.extra input.opm{flex:1 1 180px;min-height:38px;font-size:14px;padding:5px 9px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.work{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
.work.with-opl{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.opl{position:sticky;top:150px;background:var(--paper);border-radius:12px;padding:12px;max-height:calc(100vh - 170px);display:flex;flex-direction:column;gap:8px}
.opl .view{overflow:auto;background:#fff;border-radius:6px;flex:1;min-height:300px}
.opl canvas,.opl img{display:block;width:100%;height:auto}
.card{background:var(--paper);border-radius:12px;padding:16px}
pre.fb{white-space:pre-wrap;font:14px/1.5 system-ui,sans-serif;margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:8px 0 20px}
.kpi{background:var(--paper);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:clamp(26px,3.4vw,36px);line-height:1.1;font-weight:800}
.kpi span{font-size:14px;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.low{color:var(--err);font-weight:700}
.ok{color:var(--mint);font-weight:600}
.bar{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) 52px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.bar .t{height:14px;background:var(--paper2);border-radius:7px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--mint);border-radius:7px}
.bar .t i.lo{background:var(--err)}.bar .t i.mid{background:var(--warn)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px}
.empty{background:var(--paper);border-radius:12px;padding:28px;text-align:center}
.empty p{max-width:560px;margin:0 auto 14px}
.note{font-size:14px;color:var(--mute);background:var(--paper);border-left:3px solid var(--mint);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0 16px}
.ed td{padding:4px}
.ed input{width:100%;min-height:40px;font-size:15px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;background:var(--paper)}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.lbl{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.codeed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,2fr) 76px 44px;gap:6px;margin:6px 0}
.codeed input{min-height:40px;font-size:14px}
.deeled{display:grid;grid-template-columns:60px minmax(0,2fr) 76px 64px 44px;gap:6px;margin:6px 0}
.deeled input{min-height:40px;font-size:14px}
.subbox{border-left:2px solid var(--line);padding-left:12px;margin:10px 0}
.scroll{overflow-x:auto}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
.drop.over{border-color:var(--mint);background:var(--mint-d)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:18px 0}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 20px;text-align:left;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tile b{font-size:28px;line-height:1.1;font-weight:800}
.tile span{color:var(--mute);font-size:14px}
.tile[aria-current=true]{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint) inset}
.tile:hover{border-color:var(--mint)}
.hero{padding:10px 0 0}
.hero h2{font-size:clamp(28px,4vw,40px);line-height:1.1;font-weight:800;margin-bottom:6px}
#copybox{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#copybox>div{background:var(--paper);border-radius:12px;padding:18px;max-width:640px;width:100%}
@media(max-width:900px){.work.with-opl{grid-template-columns:1fr}.opl{position:static;max-height:none}.opl .view{max-height:70vh}}
@media(max-width:600px){
 .r,.with-opl .r{grid-template-columns:1fr}
 .cols{grid-template-columns:1fr}
 .codeed{grid-template-columns:1fr 76px 44px}.codeed input:nth-child(2),.codeed input:nth-child(3){grid-column:1/-1}
 .deeled{grid-template-columns:50px 1fr 64px 44px}.deeled input:nth-child(4){display:none}
 .bar{grid-template-columns:minmax(0,1fr) 52px}.bar .t{grid-column:1/-1;order:3}
 table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}
}
@media(prefers-reduced-motion:no-preference){.bar .t i{transition:width .4s ease}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header>
  <div class="top">
    <h1><i>Sk</i>Skoreboek</h1>
    <div class="sel"><label for="ksel" class="status">Klas</label><select id="ksel"></select><label for="tsel" class="status">Toets</label><select id="tsel"></select><span class="status" id="status">Laden…</span></div>
  </div>
  <nav id="tabs">
    <button data-tab="start">Klas kiezen</button>
    <button data-tab="verbeter">Verbeteren</button>
    <button data-tab="overzicht">Overzicht</button>
    <button data-tab="skore">Naar Skore / Excel</button>
    <button data-tab="klassen">Klassen</button>
    <button data-tab="instel">Toetsen</button>
    <button data-tab="gegevens">Back-up</button>
  </nav>
</header>
<main id="main"><p class="sub">Laden…</p></main>
<div id="copybox" role="dialog" aria-label="Tekst kopiëren"><div><h3 style="margin-top:0">Kopieer deze tekst</h3><p class="sub">Automatisch kopiëren lukte niet. Selecteer alles en kopieer.</p><textarea id="copyta" rows="10"></textarea><p><button class="btn pri" id="copyclose">Sluiten</button></p></div></div>
<script>
{
const main=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=x=>(Math.round((+x||0)*100)/100).toString().replace('.',',');
const num=s=>{const n=+String(s??'').trim().replace(',','.');return Number.isFinite(n)?n:NaN};
const clone=o=>JSON.parse(JSON.stringify(o));
const rid=()=>Math.random().toString(36).slice(2,9);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const norm=s=>String(s||'').trim().toLowerCase();
const nkey=s=>norm(s).split(/\s+/).sort().join(' ');
const ABC='abcdefghijklmnopqrstuvwxyz';

let ready=false,lastSaved=null;
const S={klassen:[],klasActief:null,toetsen:[],actief:null,laatsteBackup:null};
const T={},BIJ={};
const ui={tab:'start',modus:'vraag',vraag:null,lln:null,noemer:'',afr:0.5,delAsk:null,imp:null,impMsg:'',toonOpl:true,oplPage:1,oplVraag:null,editKlas:null,busyMsg:'',dataMsg:''};

/* ---------- opslag op dit toestel ---------- */
function setStatus(t){document.getElementById('status').textContent=t}
const idb={p:null,
 open(){return this.p||=new Promise((res,rej)=>{try{const r=indexedDB.open('skoreboek',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
 async get(k){try{const d=await this.open();return await new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}},
 async set(k,v){const d=await this.open();return new Promise((res,rej)=>{const tx=d.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}};
const tijd=d=>new Date(d).toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'});
function pakData(){
  const bij={};for(const [k,v] of Object.entries(BIJ))if(S.toetsen.some(x=>T[x.id]?.opl?.id===k))bij[k]=v;
  return {app:'skoreboek',versie:2,bewaard:Date.now(),klassen:S.klassen,klasActief:S.klasActief,toetsen:S.toetsen.map(x=>T[x.id]).filter(Boolean),actief:S.actief,laatsteBackup:S.laatsteBackup,bijlagen:bij};
}
function normToets(t){
  t.scores||={};t.afw||={};t.alg||={};
  for(const v of t.vragen||[]){v.codes=(v.codes||[]).map(c=>({aftrek:0,...c}));v.delen=(v.delen||[]).map(d=>({...d,codes:(d.codes||[]).map(c=>({aftrek:0,...c}))}))}
  return t;
}
function zetData(d){
  if(!d||!Array.isArray(d.toetsen)||!Array.isArray(d.klassen))throw new Error('Dit is geen back-up van Skoreboek.');
  for(const k of Object.keys(T))delete T[k];
  S.klassen=d.klassen;S.klasActief=d.klassen.some(k=>k.id===d.klasActief)?d.klasActief:d.klassen[0]?.id||null;
  S.toetsen=d.toetsen.map(t=>{T[t.id]=normToets(t);return {id:t.id,titel:t.titel}});
  S.actief=d.actief&&T[d.actief]?d.actief:S.toetsen[0]?.id||null;S.laatsteBackup=d.laatsteBackup||null;
  for(const [k,v] of Object.entries(d.bijlagen||{}))BIJ[k]=v;
  for(const k of Object.keys(pdfDocs))delete pdfDocs[k];
  lastSaved=d.bewaard||Date.now();ui.vraag=null;ui.lln=null;
}
let saveTimer=null,saving=false,again=false,persistAsked=false;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,600);setStatus('Opslaan…')}
async function persist(){
  if(saving){again=true;return}saving=true;
  try{const d=pakData();await idb.set('data',d);lastSaved=d.bewaard;setStatus('Bewaard om '+tijd(lastSaved));
    if(!persistAsked&&navigator.storage?.persist){persistAsked=true;try{await navigator.storage.persist()}catch(e){}}}
  catch(e){setStatus('Opslaan mislukt: maak een back-up')}
  finally{saving=false;if(again){again=false;persist()}}
}
async function init(){
  render();
  try{const d=await idb.get('data');if(d)zetData(d);setStatus(lastSaved?'Bewaard op dit toestel':'Nog niets bewaard')}
  catch(e){setStatus('Opslag niet beschikbaar: maak back-ups')}
  ready=true;
  if(!S.actief&&S.toetsen.length)S.actief=S.toetsen[0].id;
  ui.tab=S.klassen.length?'start':'klassen';
  render();
}
function saveBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function deelOfDownload(blob,name,btn){
  try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return 'gedeeld'}}catch(e){if(e?.name==='AbortError')return 'geannuleerd'}
  saveBlob(blob,name);return 'gedownload';
}
async function downloadBackup(btn,delen){
  S.laatsteBackup=Date.now();const blob=new Blob([JSON.stringify(pakData())],{type:'application/json'}),name=`skoreboek-backup-${new Date().toISOString().slice(0,10)}.json`;
  const r=delen?await deelOfDownload(blob,name):(saveBlob(blob,name),'gedownload');save();ui.dataMsg=r==='geannuleerd'?'':`Back-up ${r}.`;render();
}
async function leesBackup(f){
  if(!f)return;
  try{const d=JSON.parse(await f.text());zetData(d);await persist();ui.dataMsg=`Back-up ${f.name} ingeladen.`}
  catch(e){ui.dataMsg=e?.message?.startsWith('Dit is geen')?e.message:'Dit bestand kon niet gelezen worden.'}
  render();
}

/* ---------- model: vragen, deelvragen en scoorbare onderdelen ---------- */
const act=()=>T[S.actief]||null;
const klas=()=>S.klassen.find(k=>k.id===S.klasActief)||null;
const L=()=>klas()?.lln||[];
const vMax=v=>v.delen?.length?v.delen.reduce((a,d)=>a+(+d.max||0),0):(+v.max||0);
function units(t){const out=[];for(const v of t.vragen){
  if(v.delen?.length)for(const d of v.delen)out.push({key:v.id+'.'+d.id,v,d,nr:`${v.nr}${d.label}`,label:d.titel||v.label,max:+d.max||0,codes:d.codes,rem:v.rem,blz:d.blz||v.blz,module:v.module,lpd:v.lpd});
  else out.push({key:v.id,v,d:null,nr:String(v.nr),label:v.label,max:+v.max||0,codes:v.codes,rem:v.rem,blz:v.blz,module:v.module,lpd:v.lpd});}return out}
const unit=(t,k)=>units(t).find(u=>u.key===k);
const maxT=t=>t.vragen.reduce((a,v)=>a+vMax(v),0);
const mods=t=>[...new Set(t.vragen.map(v=>v.module||'–'))];
const kort=m=>(m||'').split(' ')[0];
const ent=(t,l,k)=>((t.scores[l]||={})[k]||={p:null,c:[],o:''});
const pOf=(t,l,k)=>t.scores[l]?.[k]?.p;
function tot(t,l){let s=0,n=0;const us=units(t);for(const u of us){const p=pOf(t,l,u.key);if(p!=null){s+=p;n++}}return{s,n,klaar:n===us.length,aantal:us.length}}
function modS(t,l,m){let s=0,mx=0;for(const u of units(t))if((u.module||'–')===m){mx+=u.max;s+=pOf(t,l,u.key)||0}return{s,mx}}
const aanwezig=t=>L().filter(x=>!t.afw?.[x.id]);
const r4=x=>Math.round(x*4)/4;
function setP(l,k,val){
  const t=act(),u=unit(t,k);if(!u)return;
  ent(t,l,k).p=(val===''||val==null||Number.isNaN(val))?null:Math.min(u.max,Math.max(0,r4(val)));
  save();
}
function toggleCode(l,k,cid){
  const t=act(),u=unit(t,k),c=u?.codes.find(x=>x.id===cid);if(!c)return;
  const e=ent(t,l,k),i=e.c.indexOf(cid),a=+c.aftrek||0;
  if(i<0){e.c.push(cid);if(a>0)e.p=Math.max(0,r4((e.p??u.max)-a))}
  else{e.c.splice(i,1);if(a>0&&e.p!=null)e.p=Math.min(u.max,r4(e.p+a))}
  save();
}
function feedback(t,l){
  if(t.afw?.[l])return t.titel+': afwezig.';
  const mx=maxT(t),{s}=tot(t,l),out=[`${t.titel}: ${nf(s)}/${nf(mx)} (${pct(s,mx)} %)`];
  const ms=mods(t).map(m=>{const r=modS(t,l,m);return{m,...r,q:r.mx?r.s/r.mx:0}});
  if(ms.length>1)out.push('Per onderdeel: '+ms.map(r=>`${kort(r.m)} ${nf(r.s)}/${nf(r.mx)}`).join(' · '));
  const goed=ms.filter(r=>r.q>=.8);
  if(goed.length&&ms.length>1)out.push('Sterk: '+goed.map(r=>r.m).join(', ')+'.');
  const werk=[],rems=new Set();
  for(const u of units(t)){
    const e=t.scores[l]?.[u.key];if(!e)continue;
    const cs=(e.c||[]).map(id=>u.codes.find(c=>c.id===id)).filter(Boolean);
    for(const c of cs){werk.push(`• Vraag ${u.nr}: ${c.fb||c.label}`);if(c.rem)rems.add(c.rem)}
    if(!cs.length&&e.p!=null&&u.max>0&&e.p/u.max<.5){werk.push(`• Vraag ${u.nr} (${u.label}): ${nf(e.p)}/${nf(u.max)}.`);if(u.rem)rems.add(u.rem)}
    if(e.o)werk.push(`• Vraag ${u.nr}: ${e.o}`);
  }
  if(werk.length)out.push('Werkpunten:',...werk);
  if(rems.size)out.push('Zo werk je eraan:',...[...rems].map(r=>'→ '+r));

}

    const name=dec.decode(u.subarray(p+46,p+46+nl)),st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);

    if(typeof DecompressionStream==='undefined')throw new Error('Deze browser kan geen Excel lezen; gebruik CSV of plak de lijst');
    return await new Response(new Blob([f.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()}};
}

let pdfLib=null,drawSeq=0;const pdfDocs={};

async function drawOpl(){

  const seq=++drawSeq;
  try{const doc=await getPdf(t.opl.id);ui.oplPage=Math.min(Math.max(1,ui.oplPage),doc.numPages);
    const pi=document.getElementById('oplpage');if(pi)pi.textContent=`blz ${ui.oplPage} / ${doc.numPages}`;
    const page=await doc.getPage(ui.oplPage);if(seq!==drawSeq)return;
    const w=box.clientWidth||600,dpr=window.devicePixelRatio||1,vp0=page.getViewport({scale:1}),vp=page.getViewport({scale:w/vp0.width*dpr});

    if(seq!==drawSeq)return;box.innerHTML='';box.appendChild(c);

function vOverzicht(t){

function vEditor(t){
  return `<h2 style="margin-top:28px">Toets bewerken: ${esc(t.titel)}</h2><p class="sub">Wijzigingen worden meteen bewaard. Totaal: <b>${nf(maxT(t))} punten</b>.</p>
  <div class="row-btns"><input type="text" data-ed="toets" data-k="titel" value="${esc(t.titel)}" aria-label="Titel" style="flex:1 1 260px"><input type="date" data-ed="toets" data-k="datum" value="${esc(t.datum)}" aria-label="Datum"></div>
  <h3>Modeloplossing</h3>
  <div class="row-btns">${t.opl?`<span>📄 <b>${esc(t.opl.naam||'modeloplossing')}</b>${BIJ[t.opl.id]?'':' <span class="low">(bestand ontbreekt)</span>'}</span>`:'<span class="sub" style="margin:0">Nog geen modeloplossing.</span>'}
   <label class="btn pri">${t.opl?'Vervangen':'PDF of foto kiezen'}<input type="file" id="oplfile" accept="application/pdf,image/*"></label>${t.opl?`<button class="btn red" data-act="oplweg">${ui.delAsk==='opl'?'Zeker?':'Verwijderen'}</button>`:''}</div>
  ${ui.busyMsg?`<p class="sub">${esc(ui.busyMsg)}</p>`:''}<p class="sub">Tip: vul per vraag de pagina (Blz) in, of klik tijdens het verbeteren op <i>Koppel deze pagina</i>.</p>
  <h3>Vragen</h3>
  <div class="scroll"><table class="ed"><thead><tr><th>Nr</th><th>Omschrijving</th><th>Module</th><th>LPD</th><th>Max</th><th>Blz</th><th></th></tr></thead><tbody>
  ${t.vragen.map(v=>{const hd=v.delen.length;return `<tr><td style="width:60px"><input type="text" data-ed="vraag" data-v="${v.id}" data-k="nr" value="${esc(v.nr)}" aria-label="Nummer"></td><td><input type="text" data-ed="vraag" data-v="${v.id}" data-k="label" value="${esc(v.label)}" aria-label="Omschrijving"></td><td><input type="text" data-ed="vraag" data-v="${v.id}" data-k="module" value="${esc(v.module)}" aria-label="Module" placeholder="bv. M3 Zouten"></td><td style="width:110px"><input type="text" data-ed="vraag" data-v="${v.id}" data-k="lpd" value="${esc(v.lpd)}" aria-label="LPD"></td><td style="width:72px"><input type="text" inputmode="decimal" data-ed="vraag" data-v="${v.id}" data-k="max" value="${nf(vMax(v))}" aria-label="Maximum" ${hd?'disabled title="Som van de deelvragen"':''}></td><td style="width:60px"><input type="text" inputmode="numeric" data-ed="vraag" data-v="${v.id}" data-k="blz" value="${esc(v.blz||'')}" aria-label="Pagina modeloplossing"></td><td style="width:52px"><button class="btn red" data-act="delv" data-v="${v.id}" aria-label="Vraag verwijderen">×</button></td></tr>`}).join('')}
  </tbody></table></div><p><button class="btn" data-act="addv">+ Vraag</button></p>
  <h3>Deelvragen, foutcodes en remediëring</h3><p class="sub">Open een vraag om deelvragen (a, b, c …) toe te voegen of foutcodes in te stellen. Een foutcode met aftrek trekt die punten automatisch af bij het aanklikken.</p>
  ${t.vragen.map(v=>`<details data-v="${v.id}"${ui.openV===v.id?' open':''}><summary>Vraag ${esc(v.nr)}: ${esc(v.label||'(zonder omschrijving)')} <span class="meta">· ${v.delen.length?v.delen.length+' deelvragen':'geen deelvragen'} · ${(v.delen.length?v.delen.reduce((a,d)=>a+d.codes.length,0):v.codes.length)} foutcodes · max ${nf(vMax(v))}</span></summary>
   <label class="lbl">Remediëring als de leerling onder de helft scoort zonder foutcode</label><input type="text" style="width:100%" data-ed="vraag" data-v="${v.id}" data-k="rem" value="${esc(v.rem)}" placeholder="bv. Herwerk werkbundel oxiden opgave 3">
   <div class="subbox"><span class="lbl">Deelvragen — letter · omschrijving (optioneel) · max · blz</span>
    ${v.delen.map(d=>`<div class="deeled"><input type="text" data-ed="deel" data-v="${v.id}" data-d="${d.id}" data-k="label" value="${esc(d.label)}" aria-label="Letter"><input type="text" data-ed="deel" data-v="${v.id}" data-d="${d.id}" data-k="titel" value="${esc(d.titel)}" placeholder="omschrijving" aria-label="Omschrijving"><input type="text" inputmode="decimal" data-ed="deel" data-v="${v.id}" data-d="${d.id}" data-k="max" value="${nf(d.max)}" aria-label="Maximum"><input type="text" inputmode="numeric" data-ed="deel" data-v="${v.id}" data-d="${d.id}" data-k="blz" value="${esc(d.blz||'')}" placeholder="blz" aria-label="Pagina"><button class="btn red" data-act="deld" data-v="${v.id}" data-d="${d.id}" aria-label="Deelvraag verwijderen">×</button></div>`).join('')}
    <button class="btn" data-act="addd" data-v="${v.id}">+ Deelvraag</button>${v.delen.length?'':'<span class="meta" style="margin-left:8px">Zonder deelvragen scoor je de vraag als geheel.</span>'}</div>
   ${v.delen.length?v.delen.map(d=>codesEd(t,v,d)).join(''):codesEd(t,v,null)}</details>`).join('')}
  <h3>Exporteren</h3><p class="sub">Kopieer de toets (zonder scores) om hem te bewaren of opnieuw te gebruiken.</p><button class="btn" data-act="export">Kopieer toets als JSON</button>`;
}
function vGegevens(){
  return `<h2>Back-up</h2><p class="sub">Skoreboek bewaart alles op dit toestel. Maak regelmatig een back-up, bijvoorbeeld na elke verbetersessie, en bewaar die in je OneDrive.</p>
  ${ui.dataMsg?`<p class="ok">${esc(ui.dataMsg)}</p>`:''}
  <div class="grid2"><div class="card"><h3 style="margin-top:0">Back-up maken</h3><p class="sub">${S.laatsteBackup?'Laatste back-up: '+new Date(S.laatsteBackup).toLocaleString('nl-BE',{dateStyle:'short',timeStyle:'short'}):'Nog geen back-up gemaakt.'}</p>
   <div class="row-btns">${navigator.canShare?'<button class="btn pri" data-act="backupdeel">Back-up delen (naar OneDrive)</button>':''}<button class="btn${navigator.canShare?'':' pri'}" data-act="backup">Back-up downloaden</button></div></div>
  <div class="card"><h3 style="margin-top:0">Back-up inladen</h3><p class="sub">Zet een back-up terug, of laad een export uit de online verbeterapp in. Dit vervangt wat nu op dit toestel staat.</p>
   <label class="btn">Back-up kiezen<input type="file" id="backupfile" accept=".json,application/json"></label></div></div>`;
}

/* ---------- acties ---------- */
function rerow(l,k){const t=act(),u=unit(t,k),el=document.getElementById(rid2(l,k));if(!el||!u)return;
  el.outerHTML=ui.modus==='vraag'?rowQ(t,l,u):rowL(t,l,u);side()}
function side(){const t=act();
  if(ui.modus==='vraag'){const c=document.querySelector('.chips');if(c)c.outerHTML=chipsQ(t)}
  else{const l=ui.lln,ts=tot(t,l),a=document.getElementById('ltot'),m=document.getElementById('lmeta'),f=document.getElementById('fbprev');
   if(a)a.textContent=`${nf(ts.s)} / ${nf(maxT(t))}`;if(m)m.textContent=`${ts.n} van ${ts.aantal} onderdelen gescoord`;if(f)f.textContent=feedback(t,l)}}
function focusSc(l,k){const el=document.querySelector(`input.sc[data-l="${l}"][data-k="${k}"]`);if(el){el.focus();el.select()}}
async function copy(txt,btn){
  try{await navigator.clipboard.writeText(txt);if(btn){const o=btn.textContent;btn.textContent='Gekopieerd ✓';setTimeout(()=>btn.textContent=o,1500)}}
  catch(e){const b=document.getElementById('copybox'),ta=document.getElementById('copyta');ta.value=txt;b.style.display='flex';ta.focus();ta.select()}
}
const findV=(t,id)=>t.vragen.find(x=>x.id===id);
const codeList=(t,vid,did)=>{const v=findV(t,vid);if(!v)return null;return did?v.delen.find(d=>d.id===did)?.codes:v.codes};
document.getElementById('copyclose').addEventListener('click',()=>{document.getElementById('copybox').style.display='none'});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ui.tab=b.dataset.tab;ui.delAsk=null;ui.busyMsg='';ui.dataMsg='';render()});
document.getElementById('tsel').addEventListener('change',e=>{S.actief=e.target.value;ui.vraag=null;save();render()});
document.getElementById('ksel').addEventListener('change',e=>{S.klasActief=e.target.value;ui.lln=null;save();render()});
main.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
  const t=act(),{act:a,l,k,c,id}=b.dataset,v=b.dataset.v,d=b.dataset.d;
  const u=t&&k?unit(t,k):null,cur=t&&l&&k?pOf(t,l,k):null;
  switch(a){
   case 'tab':ui.tab=id;render();break;
   case 'startklas':S.klasActief=id;ui.lln=null;ui.tab=S.toetsen.length?'verbeter':'instel';save();render();scrollTo(0,0);break;
   case 'modus':ui.modus=id;render();break;
   case 'vraag':ui.vraag=id;render();break;
   case 'qprev':case 'qnext':{const us=units(t),i=us.findIndex(x=>x.key===ui.vraag)+(a==='qnext'?1:-1);if(us[i])ui.vraag=us[i].key;render();scrollTo(0,0);break}
   case 'lprev':case 'lnext':{const i=L().findIndex(x=>x.id===ui.lln)+(a==='lnext'?1:-1);ui.lln=L()[i]?.id||ui.lln;render();break}
   case 'openl':ui.tab='verbeter';ui.modus='lln';ui.lln=l;render();scrollTo(0,0);break;
   case 'dec':setP(l,k,(cur??u.max)-.5);rerow(l,k);break;
   case 'inc':setP(l,k,(cur??0)+.5);rerow(l,k);break;
   case 'zero':setP(l,k,0);rerow(l,k);break;
   case 'max':setP(l,k,u.max);rerow(l,k);break;
   case 'code':toggleCode(l,k,c);rerow(l,k);break;
   case 'toon':ui.toonOpl=true;ui.oplVraag=null;render();break;
   case 'verberg':ui.toonOpl=false;render();break;
   case 'pprev':ui.oplPage--;drawOpl();break;
   case 'pnext':ui.oplPage++;drawOpl();break;
   case 'koppel':{const uu=unit(t,ui.vraag);if(uu){(uu.d||uu.v).blz=String(ui.oplPage);save();const o=b.textContent;b.textContent='Gekoppeld ✓';setTimeout(()=>b.textContent=o,1500)}break}
   case 'oplweg':if(ui.delAsk!=='opl'){ui.delAsk='opl';render();break}{const o=t.opl;t.opl=null;ui.delAsk=null;verwijderOplData(o);save();render()}break;
   case 'copyfb':copy(feedback(t,l),b);break;
   case 'copyscores':copy(L().map(x=>skoreScore(t,x.id)).join('\n'),b);break;
   case 'copyall':copy(['Leerling\tScore\tFeedback',...L().map(x=>[x.naam,skoreScore(t,x.id),'"'+feedback(t,x.id).replace(/"/g,'""')+'"'].join('\t'))].join('\n'),b);break;
   case 'excel':exportExcel(b);break;
   case 'backup':downloadBackup(b,false);break;
   case 'backupdeel':downloadBackup(b,true);break;
   case 'plak':{const fb=document.getElementById('impklas').value.trim()||'Klas zonder naam';ui.imp=groepeer(rowsToLln(readCsv(document.getElementById('plak').value),fb));ui.impMsg=ui.imp.length?'':'Geen namen gevonden.';render();break}
   case 'bewaarimp':bewaarImport();break;
   case 'annimp':ui.imp=null;ui.impMsg='';render();break;
   case 'editklas':ui.editKlas=id||null;render();break;
   case 'bewaarklas':{const kl=S.klassen.find(x=>x.id===id),names=document.getElementById('klasta').value.split('\n').map(s=>s.trim()).filter(Boolean);
     kl.naam=document.getElementById('klasnaam').value.trim()||kl.naam;kl.lln=names.map(n=>kl.lln.find(x=>nkey(x.naam)===nkey(n))||{id:'l'+rid(),naam:n});ui.editKlas=null;save();render();break}
   case 'nieuweklas':{const kl={id:'k'+rid(),naam:'Nieuwe klas',lln:[]};S.klassen.push(kl);S.klasActief=kl.id;ui.editKlas=kl.id;save();render();break}
   case 'delklas':if(ui.delAsk!==id){ui.delAsk=id;render();break}
     S.klassen=S.klassen.filter(x=>x.id!==id);if(S.klasActief===id)S.klasActief=S.klassen[0]?.id||null;ui.delAsk=null;save();render();break;
   case 'kies':S.actief=id;ui.vraag=null;save();render();break;
   case 'dupliceer':{const src=clone(T[id]);src.titel+=' (kopie)';const nt=nieuweToets({...src,id:src.id.split('-')[0]});nt.opl=src.opl;render();break}
   case 'del':if(ui.delAsk!==id){ui.delAsk=id;render();break}
     {const o=T[id]?.opl;delete T[id];S.toetsen=S.toetsen.filter(x=>x.id!==id);verwijderOplData(o);if(S.actief===id)S.actief=S.toetsen[0]?.id||null;ui.delAsk=null;save();render()}break;
   case 'nieuw':nieuweToets({titel:'Nieuwe toets',vragen:[{nr:1,label:'',max:1}]});render();break;
   case 'import':{const m=document.getElementById('impmsg');try{const dd=JSON.parse(document.getElementById('impta').value);if(!Array.isArray(dd.vragen))throw 0;nieuweToets(dd);render()}catch(err){m.textContent='Dit is geen geldige toets (JSON met een lijst "vragen").'}break}
   case 'export':{const x=clone(t);delete x.scores;delete x.afw;delete x.alg;delete x.opl;copy(JSON.stringify(x,null,1),b);break}
   case 'addv':{const n=t.vragen.length?Math.max(...t.vragen.map(x=>+x.nr||0))+1:1;t.vragen.push({id:'v'+rid(),nr:n,label:'',module:t.vragen.at(-1)?.module||'',lpd:'',max:1,blz:'',rem:'',codes:[],delen:[]});save();render();break}
   case 'delv':t.vragen=t.vragen.filter(x=>x.id!==v);save();render();break;
   case 'addd':{const q=findV(t,v);const first=!q.delen.length;q.delen.push({id:'d'+rid(),label:ABC[q.delen.length]||'?',titel:'',max:first?(+q.max||1):1,blz:'',codes:first?q.codes:[]});if(first)q.codes=[];ui.openV=v;save();render();break}
   case 'deld':{const q=findV(t,v);q.delen=q.delen.filter(x=>x.id!==d);if(!q.delen.length)q.max=1;ui.openV=v;save();render();break}
   case 'addc':codeList(t,v,d).push({id:rid(),label:'',fb:'',rem:'',aftrek:0});ui.openV=v;save();render();break;
   case 'delc':{const q=findV(t,v),lst=codeList(t,v,d),i=lst.findIndex(x=>x.id===c);if(i>=0)lst.splice(i,1);ui.openV=v;save();render();break}
  }
});
main.addEventListener('change',e=>{
  const el=e.target,t=act();
  if(el.classList.contains('sc')){setP(el.dataset.l,el.dataset.k,el.value.trim()===''?'':num(el.value));rerow(el.dataset.l,el.dataset.k);return}
  if(el.id==='llsel'){ui.lln=el.value;render();return}
  if(el.id==='starttoets'){S.actief=el.value;ui.vraag=null;save();render();return}
  if(el.id==='klasfiles'){importFiles([...el.files]);return}
  if(el.id==='oplfile'){uploadOpl(el.files[0]);return}
  if(el.id==='backupfile'){leesBackup(el.files[0]);return}
  if(el.dataset.act==='afw'){(t.afw||={})[ui.lln]=el.checked;save();render();return}
  if(el.id==='noemer'){ui.noemer=el.value;render();return}
  if(el.id==='afr'){ui.afr=+el.value;render();return}
  const ed=el.dataset.ed;if(!ed||!t)return;
  const k=el.dataset.k;let val=el.value,rer=false;
  if(ed==='toets'){t[k]=val;const r=S.toetsen.find(x=>x.id===t.id);if(r&&k==='titel'){r.titel=val;rer=true}}
  else{const q=findV(t,el.dataset.v);if(!q)return;ui.openV=q.id;
   if(ed==='vraag'){if(k==='max'){val=num(val);if(!(val>0))return;rer=true}if(k==='blz')val=val.replace(/\D/g,'');if(k==='nr'||k==='label')rer=true;q[k]=val}
   else if(ed==='deel'){const dd=q.delen.find(x=>x.id===el.dataset.d);if(!dd)return;if(k==='max'){val=num(val);if(!(val>0))return;rer=true}if(k==='blz')val=val.replace(/\D/g,'');dd[k]=val}
   else{const cc=codeList(t,el.dataset.v,el.dataset.d)?.find(x=>x.id===el.dataset.c);if(!cc)return;if(k==='aftrek'){val=num(val.replace(/^[−-]/,''));val=val>0?val:0}cc[k]=val}}
  save();if(rer)render();
});
main.addEventListener('input',e=>{
  const el=e.target,t=act();
  if(el.classList.contains('opm')){ent(t,el.dataset.l,el.dataset.k).o=el.value;save();if(ui.modus==='lln')side();return}
  if(el.id==='alg'){(t.alg||={})[ui.lln]=el.value;save();side()}
});
main.addEventListener('keydown',e=>{
  const el=e.target;if(!el.classList.contains('sc')||e.key!=='Enter')return;
  e.preventDefault();const l=el.dataset.l,k=el.dataset.k;el.blur();
  const t=act(),us=units(t);
  if(ui.modus==='vraag'){const ll=aanwezig(t),i=ll.findIndex(x=>x.id===l);if(ll[i+1])focusSc(ll[i+1].id,k)}
  else{const i=us.findIndex(x=>x.key===k);if(us[i+1])focusSc(l,us[i+1].key)}
});
main.addEventListener('dragover',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
main.addEventListener('dragleave',e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('over')});
main.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.remove('over');importFiles([...e.dataTransfer.files])});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(ui.tab==='verbeter'&&ui.modus==='vraag'&&ui.toonOpl)drawOpl()},250)});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
}
</script>
